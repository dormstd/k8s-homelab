---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml

# Añadimos los parches para que ArgoCD gestione correctamente los Jobs
patches:
  - patch: |
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: ingress-nginx-admission-create
        annotations:
          argocd.argoproj.io/hook: PreSync
          argocd.argoproj.io/hook-delete-policy: HookSucceeded
    target:
      kind: Job
      name: ingress-nginx-admission-create

  - patch: |
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: ingress-nginx-admission-patch
        annotations:
          argocd.argoproj.io/hook: PostSync
          argocd.argoproj.io/hook-delete-policy: HookSucceeded
    target:
      kind: Job
      name: ingress-nginx-admission-patch
  - patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: ingress-nginx-controller
      spec:
        type: NodePort
        # Forzamos limpiar el campo para asegurar que ArgoCD vea que es un NodePort puro local
        status:
          loadBalancer: {}
    target:
      kind: Service
      name: ingress-nginx-controller
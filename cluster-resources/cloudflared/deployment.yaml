apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app: cloudflared
spec:
  # Cloudflare recomienda 2 réplicas para asegurar alta disponibilidad durante actualizaciones del clúster
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2026.10.0 # Es buena práctica fijar una versión estable en producción
        args:
        - tunnel
        - run
        env:
        # Inyecta tu token desde el Secret seguro que creamos al principio
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflared-secret
              key: TUNNEL_TOKEN
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        volumeMounts:
        # Monta el archivo config.yaml generado por el ConfigMap
        - name: config-volume
          mountPath: /etc/cloudflared/config
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: cloudflared-config
          items:
          - key: config.yaml
            path: config.yaml

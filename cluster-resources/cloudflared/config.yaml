apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
data:
  config.yaml: |
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      # Regla para tu subdominio de Argo CD
      - hostname: argocd.rruizs.com
        service: https://cluster.local
        originRequest:
          # Obligatorio para aceptar el certificado auto-firmado interno de Argo CD
          noTLSVerify: true
          # Habilita soporte HTTP2/gRPC para evitar cortes en la UI
          http2Origin: true
          
      # Regla catch-all obligatoria por Cloudflare (responde 404 a dominios no declarados aquí)
      - service: http_status:404